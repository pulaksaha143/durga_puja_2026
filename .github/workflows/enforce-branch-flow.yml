name: Enforce Branch Flow

on:
  pull_request:
    branches:
      - main

jobs:
  enforce-develop-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "ERROR: You can only merge into main from the develop branch. Current source branch is ${{ github.head_ref }}."
            exit 1
          fi
          echo "Source branch is develop. Proceeding."
