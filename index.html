<noscript><h1>Mumbai Durga Puja 2026 - Complete Pandal List</h1><ul><li><strong>North Bombay Sarbojanin Durga Puja (Western Suburbs)</strong>: SNDT Women's University Ground, Juhu Tara Road, Santacruz West / Juhu, Mumbai 400049. Founded by filmmaker Sasadhar Mukerji and patronized by the Mukherjee family (Rani Mukerji, Kajol, Ayan Mukerji); Bollywood celebrity presence; iconic towering eco-friendly Pratima; celebrity-served sit-down Bhog; grand air-conditioned marquee.</li><li><strong>Lokhandwala Durgotsav (Western Suburbs)</strong>: Lokhandwala Durga Puja Ground (Celebration Sports Club Ground), Lokhandwala Complex, Andheri West, Mumbai 400053. Spearheaded by Bollywood playback singer Abhijeet Bhattacharya; lavish thematic pandals replicating royal Indian architecture; star-studded musical evenings and celebrity visits; massive open food street with authentic Kolkata kathi rolls, Mughlai porota, and mishti.</li><li><strong>Ramakrishna Mission Mumbai Durga Puja (Western Suburbs)</strong>: Ramakrishna Math & Mission, 12th Road, Khar West, Mumbai 400052. Deeply spiritual and sacred atmosphere; authentic Belur Math-style Vedic rituals, stotras, and devotional kirtans; serene Kumari Puja on Maha Ashtami; traditional satvik khichuri bhog distributed with divine grace; disciplined monastic environment.</li><li><strong>Notunpalli Sarbojanin Durgotsab (Western Suburbs)</strong>: Notunpalli Maidan, 24th Road, Off Linking Road, Bandra West, Mumbai 400050. Founded under the patronship of film legends Shakti Samanta, R.D. Burman, and Basu Chatterjee; traditional Ekchala protima; legendary Dhunuchi Naach competition on Navami; cultural plays and authentic Bengali food stalls along the perimeter.</li><li><strong>Banga Maitri Sansad Durgotsav (Western Suburbs)</strong>: Prabhat Colony Ground, Near Senior Railway Institute, Prabhat Colony Road, Santacruz East, Mumbai 400055. One of the oldest and most traditional Bengali celebrations in Mumbai (over 77 years of heritage); emphasizes Bengal's folk culture like Pattachitra, terracotta, and handicraft motifs; serene, non-commercial gharua atmosphere; beloved authentic bhog.</li><li><strong>PBWA Powai Sarvajanin Durgotsav (Central Suburbs)</strong>: MCGM Ground, Opposite Jalvayu Vihar, Adjacent to BEST Bus Terminus, South Avenue, Hiranandani Gardens, Powai, Mumbai 400076. Known as 'Durgotsav with a Conscience'; majestic architectural themed pandals (past themes include Konark Sun Temple, Mahishmati Palace, and Vivekananda Rock); Mission Tejaswini social programs; massive Dhunuchi dance and Sindoor Khela spectacles.</li><li><strong>Spandan Powai Sharadotsav (Central Suburbs)</strong>: Spandan Pujo Ground, Opposite Transocean House, Lake Boulevard Road, Hiranandani Gardens, Powai, Mumbai 400076. Vibrant youth-led cultural initiatives; thematic pandals focused on national integration and green ecology; community bhog distribution; live classical and Baul music; social welfare drives supporting municipal sanitation workers.</li><li><strong>Chembur Durga Puja Association Durgotsav (Central Suburbs)</strong>: Jawahar Ground, Near Ashish Cinema, Off Mahul Road / RCF Marg, Chembur East, Mumbai 400074. Celebrated 70+ years of grand celebrations; the undisputed centerpiece of Eastern suburban Durga Puja; over 1.5 lakh devotees visit daily; breathtaking full-scale pandal recreations; high-profile cultural shows by Bengali artists from Kolkata; monumental community bhog hall.</li><li><strong>TVBA Durgotsav Kandivali (Western Suburbs)</strong>: Evershine Club Ground, Thakur Village, Kandivali East, Mumbai 400101. One of the most massive and energetic Durga Pujas in the Western suburbs; enormous eco-friendly thematic sets; prime musical concerts featuring top Tollywood and Bollywood performers; lavish sit-down bhog arrangement for thousands daily.</li><li><strong>KEBA Durgotsav Thakur Complex (Western Suburbs)</strong>: St. Lawrence High School Ground, 90 Feet Road, Thakur Complex, Kandivali East, Mumbai 400101. Vibrant community celebration in Thakur Complex; renowned for deeply traditional rituals, authentic Ekchala pratima decoration, heartfelt homemade prasad, and lively cultural dances by resident artists.</li><li><strong>Sanskriti Borivali Durgotsav (Western Suburbs)</strong>: Meenatai Thackeray Udyan (BMC Ground), Kulupwadi, Borivali East, Mumbai 400066. Distinction of being the oldest Durga Puja celebration in Mumbai Suburbs (established 1953); steeped in authentic Bengali traditional heritage; royal Pratima styling; soul-stirring Pushpanjali and Dhunuchi dance; generous free community bhog served to all.</li><li><strong>Kallol Durgotsav Goregaon (Western Suburbs)</strong>: Kallol Kali Mandir, Swami Ayyappa Temple Marg, Bangur Nagar, Goregaon West, Mumbai 400104. Over 60 years of storied history; permanent Kali Mandir sanctum; famous for heart-pumping competitive Dhunuchi Naach with live Kolkata dhakis; rich intellectual and theatrical traditions; delicious traditional Bhog of Gobindobhog rice khichuri, labra, and tomato chutney.</li><li><strong>Maitree Malad Durgotsav (Western Suburbs)</strong>: Rajora Banquet Hall, Alfa Vista Tower, Near Grand Hometel Hotel, Mindspace, Malad West, Mumbai 400064. Air-conditioned indoor elegance; authentic Bengal village art themes; traditional Sholar Saaj idol; intimate sit-down bhog experience with pristine service; musical soirees featuring Rabindrasangeet and contemporary Bengali band performances.</li><li><strong>Udayan Sarbojanin Durgotsav (Western Suburbs)</strong>: Malad Koli Samaj Sanstha Hall, Bhandarwada Gavthan Road, Near Bhujale Talav, Malad West, Mumbai 400064. Nearly 70-year legacy of suburban devotion; quintessential 'parar pujo' (neighborhood puja) vibe; community immersion and traditional Sandhi Puja with 108 lotus flowers and lamps; authentic Annaprasad and evening Aarti.</li><li><strong>Andheri Link Road Durgotsav (DN Nagar Puja) (Western Suburbs)</strong>: Chitrakoot Ground, Behind Fun Republic Theatre, Off New Link Road, D.N. Nagar, Andheri West, Mumbai 400053. Massive fully air-conditioned weatherproof tent; grand palace replica facade; popular among television actors, singers, and entertainment professionals; vibrant flea market with ethnic Bengali sarees, handicrafts, and fish cutlets.</li><li><strong>Oshiwara Cultural Association Durgotsav (Western Suburbs)</strong>: Adarsh Nagar Ground, Off New Link Road, Oshiwara, Andheri West, Mumbai 400053. Vibrant community celebration in Oshiwara; spectacular lighting displays along New Link Road; enthusiastic Dhunuchi dance rounds and Sindoor Khela; extensive food festival featuring authentic Kolkata street food.</li><li><strong>Shivranjani Durgotsav Versova (Western Suburbs)</strong>: Versova Welfare Association Ground, Yari Road, Versova, Andheri West, Mumbai 400061. Charming coastal neighborhood puja in Versova fishing village hinterland; frequented by creative writers, filmmakers, and theater personalities; traditional clay idols crafted by Kumartuli artisans; cozy community bhog.</li><li><strong>Juhu Cultural Association Durgotsav (Western Suburbs)</strong>: Indian Medical Association (IMA) Hall / Vile Parle Medical Club, J.R. Mhatre Marg, JVPD Scheme, Juhu, Mumbai 400049. Founded by legendary singer Jagmohan 'Sursagar'; known for its intimate 'ghoroa' (homely) ambiance; philanthropic tradition of serving special bhog to cancer patients and underprivileged children; classical Rabindrasangeet performances.</li><li><strong>Oikotan Durgotsav Vile Parle (Western Suburbs)</strong>: Domestic Airport Colony Ground, Hanuman Road Extension, Airport Colony, Vile Parle East, Mumbai 400099. Over three decades of neighborhood celebration; traditional aviation colony community gathering; devotional morning pushpanjali; community quiz and Antakshari; warm sit-down khichuri bhog distributed by club volunteers.</li><li><strong>Dahisar Sarbojanin Durgotsav (Western Suburbs)</strong>: NL Complex Ground, Anand Nagar, Dahisar East, Mumbai 400068. Serves the northernmost enclave of Mumbai's Bengali diaspora; traditional Pratima rituals; joyful community Dandiya-Dhunuchi fusion on Navami night; wholesome satvik bhog and authentic mishti distribution.</li><li><strong>Kurla Bengali Sarbojanin Durgotsav (Central Suburbs)</strong>: Taximen's Colony Ground, Near Kohinoor City, LBS Marg, Kurla West, Mumbai 400070. A historic central suburban community hub; brings together diverse local communities along LBS Marg; grand traditional Dhaki rhythms; community feasts and cultural dramas by local youth; heartfelt Sindoor Khela.</li><li><strong>Vikhroli Durgotsab (Central Suburbs)</strong>: Tagore Nagar Association Premises / MHADA Ground, Beside Sai Baba Mandir, Tagore Nagar, Vikhroli East, Mumbai 400083. Celebrating 60 years of cultural heritage; eco-friendly traditional clay idol; authentic sit-down community bhog with Khichuri, Labra, and Payesh; spirited evening Rabindra Sangeet, recitations, and local Bengali theatrical drama.</li><li><strong>Naval Colony Sarbojanin Durgotsav (Central Suburbs)</strong>: Naval Dockyard Civilian Housing Colony Ground, LBS Marg / Kanjur Village, Kanjurmarg West, Mumbai 400078. Organized by defense & naval dockyard personnel families; disciplined, warm and patriotic atmosphere; traditional Pushpanjali rituals; cultural songs and folk dances; community bhog cooked with authentic traditional recipes.</li><li><strong>Mulund Durga Puja (BIAC) (Central Suburbs)</strong>: Mahakavi Kalidas Natyamandir Complex, Purushottam Kheraj Marg (P.K. Road), Mulund West, Mumbai 400080. Anchored at the prestigious Kalidas Natyamandir cultural campus; acclaimed for highbrow cultural programs, classical music, recitations, and theatre dramas; traditional Shobhabazar-style Pratima; highly praised sit-down Bhog.</li><li><strong>Bangiya Parishad Thane Durgotsav (Central Suburbs)</strong>: Highland Garden (Crest), Balkum-Dhokali Link Road, Dhokali, Thane West, Maharashtra 400608. Oldest and largest Bengali socio-cultural institution in Thane (over 62 years of heritage); grand architectural replicas of historical temples; mammoth bhog dining hall serving over 5,000 devotees daily; high-profile musical nights.</li><li><strong>Aamra Prabashi Durgotsav Hiranandani Estate (Central Suburbs)</strong>: TMC Ground, Opposite Rodas Enclave, Near New Horizon Scholars School, Hiranandani Estate, Ghodbunder Road, Thane West 400607. Celebrated Silver Jubilee (25 years); premier mega-pandal on Ghodbunder Road; grand themed art installations; distinguished Bengali community participation; extensive authentic food court serving Bengali sweets, fish rolls, and kathi rolls; vibrant Dhunuchi dance.</li><li><strong>Thane East Bengal Foundation Durgotsav (Central Suburbs)</strong>: Lal Maidan, Near Gautam Arcade, Kopri Colony, Thane East, Maharashtra 400603. Historic Bengali community enclave in Kopri; intimate traditional celebrations; classical Chandipath; warm neighborhood Bhog feast; nostalgic Anandamela home-cooked food fair on Panchami.</li><li><strong>Pragati Sarbojanin Shree Shree Durga Puja (Western Suburbs)</strong>: Janaki Bai Hall, Near Bhavan's College, Munshi Nagar, Andheri West, Mumbai 400058. Long-running community puja right opposite the Bhavan's College academic campus; authentic clay idol decor, classical Rabindrasangeet evenings, and homely community bhog.</li><li><strong>Kaimur Bengali Cultural Association Durgotsav (Western Suburbs)</strong>: Kora Kendra Ground No. 2, Shimpoli Road, Off RM Bhattad Road, Borivali West, Mumbai 400092. Grand open-ground puja in Borivali West; large cultural stage hosting folk Baul troupes from Bengal; delicious food stalls serving Kolkata kathi rolls and moghlai paratha.</li><li><strong>Sarvajanik Durga Puja Ghatkopar (Central Suburbs)</strong>: Pant Nagar Maidan, Near BEST Colony & Railway Station, Ghatkopar East, Mumbai 400075. 50-year-old traditional celebration in the central suburbs; deeply revered neighborhood puja with authentic Kumari Puja and daily Annaprasad for all visitors.</li><li><strong>Aponjan Cultural Association Durgotsav (Western Suburbs)</strong>: Sonam Jyot Ground, New Golden Nest Road, Bhayandar East, Mira Bhayandar 401105. The most celebrated Durga Puja for the northern suburban cluster of Mira-Bhayandar; famous for vibrant Dhunuchi Naach, 500+ seating community bhog hall, and lively Anandamela.</li><li><strong>Agomoni Durgotsav Thane (Central Suburbs)</strong>: Brahmand TMC Ground, Opposite Phase 4, Off Ghodbunder Road, Thane West 400607. Popular neighborhood celebration along Ghodbunder Road; celebrated for authentic artistic idol, children's drama performances, and hygienic sit-down community bhog.</li><li><strong>Kalyan Bengali Cultural Association Durgotsav (Central Suburbs)</strong>: Senior Railway Institute Ground, Murbad Road, Near Kalyan Junction, Kalyan West 421301. Oldest and premier Durga Puja in Kalyan; organized by central railway personnel and the suburban diaspora; famous for heartfelt Chandipath, Anandamela food fair, and traditional sit-down Bhog.</li><li><strong>Regency Estate Sarbojanin Durgotsav (Central Suburbs)</strong>: Regency Estate Clubhouse Ground, Sonarpada, Kalyan-Shil Road, Dombivli East 421204. Vibrant modern township celebration; massive footfall from newly developed residential nodes; live musical concerts; enthusiastic Dandiya and Dhunuchi dance fusion.</li><li><strong>Navi Mumbai Bengali Association (NMBA) Sharodotsav (Central Suburbs)</strong>: CIDCO Exhibition Centre, Swami Pranabananda Marg, Sector 30, Vashi, Navi Mumbai 400703. The undisputed mega-pandal of Navi Mumbai and one of India's largest indoor air-conditioned Durga Puja celebrations; sprawling 100,000 sq ft hall; daily footfall exceeding 2 lakh devotees; monumental sit-down Bhog serving thousands simultaneously; concerts by Kolkata musical legends.</li><li><strong>Bengal Association Nerul Durgotsav (Central Suburbs)</strong>: Bengal Association Bhawan, Plot No. 12, Sector 5, Beside SBOA School, Nerul East, Navi Mumbai 400706. Over 40 years of tradition with a permanent Kali Temple complex; deeply revered spiritual ambiance; authentic Kumartuli idol; disciplined Pushpanjali; beloved traditional Gobindobhog khichuri and labra bhog.</li><li><strong>Airoli Bengali Association Durgotsav (Central Suburbs)</strong>: Sector 8A Playground, Near Vibgyor High School & Airoli Sports Association, Airoli, Navi Mumbai 400708. Premier celebration in the Thane-Belapur IT industrial corridor; features traditional Sholar Saaj pratima, classical musical concerts, Anandamela food fair, and hearty community bhog.</li><li><strong>Seawoods Bengali Cultural Association Durgotsav (Central Suburbs)</strong>: Sector 48 Playground, Near Podar International School, Seawoods West, Navi Mumbai 400706. Vibrant coastal node celebration near Grand Central Mall; known for intimate community warmth, cultural dance dramas, eco-friendly rituals, and delicious sit-down khichuri bhog.</li><li><strong>New Panvel Bengali Association Durgotsav (Central Suburbs)</strong>: CIDCO Ground, Sector 10, Khanda Colony, New Panvel, Navi Mumbai 410206. Oldest and largest Durga Puja in the Panvel and Raigad gateway region; over 25 years of celebration; traditional Kumartuli idol; authentic Bengali sweets and delicacies; family-oriented cultural programs.</li><li><strong>Koparkhairane Bengali Cultural Association Durgotsav (Central Suburbs)</strong>: Sector 11 Sports Ground, Near D-Mart, Koparkhairane, Navi Mumbai 400709. Community hub for Koparkhairane and Ghansoli residents; lively Dhunuchi naach; traditional Anandamela food fair; daily sit-down Annaprasad and cultural performances.</li><li><strong>Bangiya Sanskritik Parishad Durgotsav Kalyan (Central Suburbs)</strong>: Kali Mata Mandir Premises, Near St. Xavier's International School, Bhagirathi Nagar, Adharwadi, Kalyan West 421301. Celebrating over 60 years of heritage; one of Kalyan's oldest and grandest Durga Pujas; acclaimed for monumental replica pandals (such as Badrinath and Kedarnath temples), solemn Kumari Puja, traditional Dhunuchi dance, and daily community Bhog.</li><li><strong>Bombay Durgabari Samiti Durga Puja (South Mumbai)</strong>: Tejpal Hall, Gowalia Tank, South Mumbai. One of the oldest pujas in Mumbai, known for its traditional Ekchala Pratima and authentic cultural programs. Hosted indoors at Tejpal Hall.</li><li><strong>Bengal Club Durga Puja (South Mumbai / Dadar)</strong>: Shivaji Park, Dadar West, Mumbai. Extremely historic and traditional puja in the heart of Dadar. Beautiful Daker Saaj idol and extensive food stalls.</li><li><strong>Dombivli Bangiya Samiti Durgotsav (Thane District)</strong>: Subhash Chandra Bose Ground, Dombivli East. Largest puja in Dombivli, known for huge footfall and authentic Bengali bhog and cultural evenings.</li><li><strong>Vasai Virar Bengali Association Durga Puja (Palghar District)</strong>: Sun City Ground, Vasai West. Grand celebration catering to the vast Bengali diaspora in the Vasai-Virar belt. Theme-based pandal.</li><li><strong>Kharghar Bengali Association Durgotsav (Navi Mumbai)</strong>: Central Park Ground, Sector 20, Kharghar. Known for creative socio-cultural themes, enormous pandal space, and fantastic food festival.</li><li><strong>Ambernath Bengali Cultural Association Durga Puja (Thane District)</strong>: Shiv Mandir Art Gallery Ground, Ambernath East. One of the oldest in the Kalyan-Ambernath belt, deeply rooted in tradition.</li><li><strong>Vashi Cultural Association Durgotsav (Navi Mumbai)</strong>: Sector 10 Ground, Vashi. Popular community gathering in Vashi with intricate pandal art and strong focus on community rituals.</li><li><strong>Badlapur Bengali Association Durga Puja (Thane District)</strong>: Gandhi Chowk Ground, Badlapur East. Central gathering point for the Badlapur Bengali community.</li><li><strong>Kalina Sarbojanin Durgotsav (Western Suburbs)</strong>: Air India Colony Ground, Kalina. Well-established local puja with great community participation.</li><li><strong>Amchi Mumbai Sarbojanin Durga Puja (Central Suburbs)</strong>: Somaiya Ground, Sion East, Mumbai. Massive ground, cultural integration, heavily visited by Central line residents.</li><li><strong>Chembur Naka Durgotsav (Central Suburbs)</strong>: Chembur Naka Ground, Chembur, Mumbai. Well-known traditional puja with huge Anjali crowds in the morning.</li><li><strong>Vasant Vihar Bengali Association Durga Puja (Thane District)</strong>: Vasant Vihar Club Ground, Thane West. A very posh and well-organized puja with excellent food stalls and a premium ambience.</li><li><strong>CBD Belapur Bengali Cultural Association (Navi Mumbai)</strong>: Urban Haat Ground, CBD Belapur, Navi Mumbai. Located in a picturesque area with a strong focus on authentic Bengali art and culture.</li><li><strong>Boisar Bengali Association Durgotsav (Palghar District)</strong>: Boisar Tarapur Ground, Boisar West. The primary gathering for Bengalis in the Tarapur industrial belt.</li></ul></noscript>
